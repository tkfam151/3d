# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/tkfam151/3d
services:
  - type: web
    name: print-desk
    runtime: node
    plan: starter            # needed for the persistent disk below (~$7/month)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    disk:
      name: print-desk-data  # orders, uploaded STL/3MF files and preview images
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SITE_NAME
        value: Print Desk
      - key: PICKUP_LOCATIONS
        value: PU2,PU3
      - key: EMAIL_MODE
        value: draft
      # Required on the /admin first-run screen, so only you can create the first admin.
      # Find it in Render → print-desk → Environment.
      - key: SETUP_CODE
        generateValue: true
